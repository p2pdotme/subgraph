# CIRCLE
type Circle @entity {
  id: Bytes!

  circleId: BigInt!
  admin: String!
  currency: Bytes!
  name: String!
  communityLink: String!
  adminLink: String!
  isAutoApprovedPCEnabled: Boolean!

  metrics: CircleMetrics @relation(name: "circle")
  orderMetricsByMonth: [CircleOrderMetricsByMonth!]
    @derivedFrom(field: "circle")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# STAKER
# An individual who stakes in any circle
type Staker @entity {
  id: Bytes!

  staker: String!

  totalStaked: BigInt!

  circleUsdcStakeRecords: [CircleUsdcStakeRecords!]!
  circleUsdcUnstakeRecords: [CircleUsdcUnstakeRecords!]!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE STAKE RECORDS
# A record of a staker's stake in a circle
type CircleUsdcStakeRecords @entity {
  id: Bytes!

  circle: Circle!
  staker: Staker!

  amount: BigInt!

  unstakeRequest: CircleUsdcUnstakeRecords

  stakedAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE UNSTAKE RECORDS
# A record of a staker's unstake in a circle
type CircleUsdcUnstakeRecords @entity {
  id: Bytes!

  circle: Circle!
  staker: Staker!

  amount: BigInt!
  availableAt: BigInt!

  status: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE METRICS
# Metrics for a circle
type CircleMetrics @entity {
  id: Bytes!

  circle: Circle @relation(name: "metrics")

  # STAKING METRICS
  totalUsdcStaked: BigInt!
  adminUsdcStaked: BigInt!

  # DELEGATION METRICS
  totalDelegatedStake: BigInt!

  # VOLUME METRICS
  totalVolume: BigInt!

  # ORDER METRICS
  totalPlacedOrdersCount: BigInt!

  # DISPUTE METRICS
  raisedDisputesCount: BigInt!
  resolvedDisputesCount: BigInt!

  # MERCHANT METRICS
  totalMerchantsCount: BigInt!

  # CIRCLE SCORE
  circleScore: BigInt! # Score 0–100
  circleStatus: String! # bootstrap | active | rejected | paused
  hasMinOrdersForScore: Boolean!
  lastScoreUpdateTimestamp: BigInt!
  scoreState: CircleScoreState!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE SCORE STATE
# Internal state used to calculate circle score. Separated from CircleMetrics
type CircleScoreState @entity {
  id: Bytes! # same as circle id
  # 30d rolling metrics (recomputed from CircleDailyMetrics)
  avgSettlementSeconds: BigInt! # paidAt → completedAt (SELL/PAY only)
  disputeRate: BigInt! # 30d rate × 10000
  rolling30dVolume: BigInt! # 30d USDC volume
  # Lifetime counters
  lifetimeAcceptedOrders: BigInt! # All orders ever accepted by a merchant
  cumulativeSettlementSeconds: BigInt! # Running sum for settlement avg
  completedSellPayOrders: BigInt! # SELL/PAY completed minus dispute-reversed (settlement avg denominator)
  activeMerchantsCount: BigInt! # Merchants with stake > 0, online, not blacklisted
  merchantFaultDisputesCount: BigInt! # All-time merchant fault disputes
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE MERCHANT
# A merchant who is registered in a circle
type CircleMerchant @entity {
  id: Bytes!
  merchant: String!
  telegramId: String!
  circleId: BigInt!

  circle: Circle!
  orders: [Orders!]

  stakedAmount: BigInt!
  delegatedStakedAmount: BigInt!

  isOnline: Boolean!
  isBlacklisted: Boolean!
  isOngoingOrder: Boolean!

  # Unstake request tracking for availability
  isUnstakeRequested: Boolean!
  unstakeRequestedAt: BigInt!
  unstakeAmount: BigInt!

  onlineAt: BigInt!
  offlineAt: BigInt!
  startedAt: BigInt!

  currency: Bytes!

  paymentChannels: [MerchantPaymentChannels!] @derivedFrom(field: "merchant")
  volumeByMonth: [MerchantVolumeByMonth!] @derivedFrom(field: "merchant")
  orderMetricsByMonth: [MerchantOrderMetricsByMonth!]
    @derivedFrom(field: "merchant")
  paymentChannelMigrations: [PaymentChannelMigration!]
    @derivedFrom(field: "merchant")
  stakeHistory: [MerchantStakeHistory!] @derivedFrom(field: "merchant")
  fcmTokens: [FCMToken!] @derivedFrom(field: "merchant")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT PAYMENT CHANNELS
# A payment channel of a merchant
type MerchantPaymentChannels @entity {
  id: Bytes!
  merchant: CircleMerchant!

  pcConfigId: BigInt!
  accountNo: BigInt!
  label: String!
  isActive: Boolean!
  status: Int!
  isMonthlyVolumeUnlimited: Boolean!
  fiatBalance: BigInt!

  # Current volume tracking for availability calculations
  dailyVolume: BigInt!
  monthlyVolume: BigInt!
  lastUpdatedDailyVolumeAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ORDERS
# A order in a circle
type Orders @entity(immutable: false) {
  id: Bytes!
  orderId: BigInt!
  type: Int!
  status: Int!
  circleId: BigInt!
  circle: Circle
  isLegacyOrder: Boolean!

  userAddress: Bytes!
  usdcRecipientAddress: Bytes!

  usdcAmount: BigInt!
  fiatAmount: BigInt!

  currency: Bytes!

  isUserCompleted: Boolean!
  userCompletedAt: BigInt!
  completedAt: BigInt!
  placedAt: BigInt!
  acceptedAt: BigInt!
  paidAt: BigInt!
  cancelledAt: BigInt!

  acceptedPCId: BigInt!
  acceptedMerchantAddress: Bytes!
  merchant: CircleMerchant
  assignedMerchants: [AssignedMerchants!]

  pubkey: String!
  encUpi: String!
  userPubKey: String!
  encMerchantUpi: String!
  cancelledBy: Bytes!

  # ADDITIONAL ORDER DETAILS
  fixedFeePaid: BigInt!
  tipsPaid: BigInt!
  actualUsdcAmount: BigInt!
  actualFiatAmount: BigInt!

  # REWARD DETAILS
  merchantRewardAmount: BigInt!
  circleAdminRewardAmount: BigInt!
  circleUSDCStakeDelegationRewardAmount: BigInt!

  # DISPUTE DETAILS
  disputeStatus: Int!
  disputeRedactTransId: BigInt!
  disputeAccountNumber: BigInt!
  disputeSettledByAddr: Bytes!
  disputeFaultType: Int!
  disputePlacedAt: BigInt!
  disputeSettledAt: BigInt!

  # INSURANCE CLAIMS
  claimSubmissions: [InsuranceClaim!] @derivedFrom(field: "order")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ASSIGNED MERCHANTS
# A merchant who is assigned to an order
type AssignedMerchants @entity {
  id: Bytes!

  assignedMerchant: String!
  assignedPCId: BigInt!
  orderId: BigInt!
  merchant: CircleMerchant

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE ADMIN REWARDS
# A rewards for a circle admin
type CircleAdminRewards @entity {
  id: Bytes!
  admin: String!

  lockedRewards: BigInt!
  earnedRewards: BigInt!
  withdrawnRewards: BigInt!
  claimableRewards: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE ADMIN REWARD CLAIM LEDGER
# Individual record for each admin reward claim
type CircleAdminRewardClaimLedger @entity(immutable: true) {
  id: Bytes!
  admin: String!
  amount: BigInt!
  claimedAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT REWARDS
# A rewards for a merchant
type MerchantRewards @entity {
  id: Bytes!
  merchant: String!

  lockedRewards: BigInt!
  earnedRewards: BigInt!
  withdrawnRewards: BigInt!
  claimableRewards: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT REWARD CLAIM LEDGER
# Individual record for each merchant reward claim
type MerchantRewardClaimLedger @entity(immutable: true) {
  id: Bytes!
  merchant: String!
  amount: BigInt!
  claimedAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT VOLUME BY MONTH
# A volume for a merchant by month
type MerchantVolumeByMonth @entity {
  id: Bytes!

  merchant: CircleMerchant!
  circle: Circle!
  paymentChannel: MerchantPaymentChannels!

  month: String!
  volume: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT ORDER METRICS BY MONTH
# Order metrics for a merchant by year-month
type MerchantOrderMetricsByMonth @entity {
  id: Bytes!

  merchant: CircleMerchant!

  # Year-month format: "YYYY-MM" (e.g., "2024-01")
  month: String!

  # Order counts for this month (totalOrders = completed + cancelled)
  # Order counts for this month (cancelledOrdersCount = cancelledBuyOrdersCount + cancelledSellOrdersCount + cancelledPayOrdersCount)
  cancelledBuyOrdersCount: BigInt!
  cancelledSellOrdersCount: BigInt!
  cancelledPayOrdersCount: BigInt!

  # Order counts for this month (completedOrdersCount = completedBuyOrdersCount + completedSellOrdersCount + completedPayOrdersCount)
  completedBuyOrdersCount: BigInt!
  completedSellOrdersCount: BigInt!
  completedPayOrdersCount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE ORDER METRICS BY MONTH
# Order metrics for a circle by year-month
type CircleOrderMetricsByMonth @entity {
  id: Bytes!

  circle: Circle!

  # Year-month format: "YYYY-MM" (e.g., "2024-01")
  month: String!

  # Order counts for this month
  cancelledBuyOrdersCount: BigInt!
  cancelledSellOrdersCount: BigInt!
  cancelledPayOrdersCount: BigInt!

  completedBuyOrdersCount: BigInt!
  completedSellOrdersCount: BigInt!
  completedPayOrdersCount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT STAKE HISTORY
# A record of a merchant's stake and unstake activity
type MerchantStakeHistory @entity(immutable: true) {
  id: Bytes!

  merchant: CircleMerchant!
  circle: Circle!

  # Type of activity: STAKED, UNSTAKE_REQUESTED, UNSTAKE_REJECTED, UNSTAKE_APPROVED, DELEGATED, UNDELEGATED
  type: String!

  # Staked balance before this record
  balanceBefore: BigInt!

  # Staked balance after this record
  balanceAfter: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# PAYMENT CHANNEL CONFIG
# Configuration for a payment channel (e.g., UPI, IMPS, Pix, etc.)
type PaymentChannelConfig @entity {
  id: Bytes!

  paymentChannelId: BigInt!
  name: String!
  dailyVolumeLimit: BigInt!
  currency: Bytes!
  isActive: Boolean!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CURRENCY CONFIG
# Monthly volume limit configuration per currency
type CurrencyConfig @entity {
  id: Bytes!

  currency: Bytes!
  monthlyVolumeLimit: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CURRENCY METRICS BY MONTH
# Global per-currency monthly metrics aggregating order counts and USDC volume
type CurrencyMetricsByMonth @entity {
  id: Bytes!

  currency: Bytes!
  month: String! # "YYYY-MM" format

  # Completed order counts by type
  completedBuyOrdersCount: BigInt!
  completedSellOrdersCount: BigInt!
  completedPayOrdersCount: BigInt!

  # Cancelled order counts by type
  cancelledBuyOrdersCount: BigInt!
  cancelledSellOrdersCount: BigInt!
  cancelledPayOrdersCount: BigInt!

  # Volume (USDC, completed orders only)
  totalVolume: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CURRENCY METRICS BY DAY
# Global per-currency daily metrics aggregating order counts and USDC volume
type CurrencyMetricsByDay @entity {
  id: Bytes!

  currency: Bytes!
  day: String! # "YYYY-MM-DD" format

  # Completed order counts by type
  completedBuyOrdersCount: BigInt!
  completedSellOrdersCount: BigInt!
  completedPayOrdersCount: BigInt!

  # Cancelled order counts by type
  cancelledBuyOrdersCount: BigInt!
  cancelledSellOrdersCount: BigInt!
  cancelledPayOrdersCount: BigInt!

  # Volume (USDC, completed orders only)
  totalVolume: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# LEGACY STATS
# Aggregated legacy order stats per currency
type LegacyStats @entity {
  id: Bytes!

  currency: Bytes!

  completedOrdersCount: BigInt!
  cancelledOrdersCount: BigInt!
  disputeCount: BigInt!
  totalVolume: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# PAYMENT CHANNEL MIGRATION
# A record of payment channel migration requests
type PaymentChannelMigration @entity {
  id: Bytes!

  merchant: CircleMerchant!

  fromAccountNo: BigInt!
  toAccountNo: BigInt!
  fromPaymentChannelIndex: BigInt!
  toPaymentChannelIndex: BigInt!

  # Migration status: 0=DEFAULT, 1=PENDING, 2=APPROVED, 3=REJECTED
  status: BigInt!

  # Fiat balance transferred during migration
  fromFiatBalance: BigInt!
  toFiatBalance: BigInt!

  requestedAt: BigInt!
  settledAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# USER
# A user who is registered in a circle
type User @entity {
  id: Bytes!

  address: Bytes!
  reputationPoint: BigInt!
  isBlacklisted: Boolean!
  primaryRecommender: Bytes!

  firstOrderCompletedAt: BigInt!
  firstOrderCompletedCurrency: Bytes!

  recentOrderCompletedAt: BigInt!
  recentOrderCompletedCurrency: Bytes!

  # Order metrics
  totalVolume: BigInt!

  cancelledBuyOrdersCount: BigInt!
  cancelledSellOrdersCount: BigInt!
  cancelledPayOrdersCount: BigInt!

  completedBuyOrdersCount: BigInt!
  completedSellOrdersCount: BigInt!
  completedPayOrdersCount: BigInt!

  orders: [Orders!] @relation(name: "UserOrders")
  socialVerified: [SocialVerified!] @relation(name: "UserSocialVerified")
  campaignClaims: [CampaignRewardRedeemed!]
    @relation(name: "UserCampaignClaims")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# SOCIAL VERIFIED
# A social verified record for a user
type SocialVerified @entity {
  id: Bytes!
  socialName: String!
  verified: Boolean!
  timestamp: BigInt!
  user: User! @relation(name: "UserSocialVerified")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# REPUTATION CHANGE
# A record of admin-initiated reputation point changes
type ReputationChange @entity {
  id: Bytes!
  admin: Bytes!
  user: Bytes!
  rpChange: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CURRENCY
# A record of currencies
type Currency @entity {
  id: Bytes!
  currency: Bytes!
  isActive: Boolean!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT REFERRAL CLAIMED
# A record of a merchant referral claim
type MerchantReferralClaimed @entity {
  id: Bytes!
  recommender: Bytes!
  recipient: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT REFERRAL REVENUE CLAIMED
# A record of a merchant referral revenue claim
type MerchantReferralRevenueClaimed @entity {
  id: Bytes!
  merchant: CircleMerchant!
  yearMonthKey: BigInt!
  reward: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CAMPAIGN
# A campaign
type Campaign @entity {
  id: Bytes!
  campaignId: BigInt!
  isActive: Boolean!
  createdAt: BigInt!

  managers: [CampaignManagers!] @derivedFrom(field: "campaign")

  # Metrics
  managersCount: BigInt!
  claimsCount: BigInt!
  totalVolume: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CAMPAIGN MANAGERS
# A manager for a campaign
type CampaignManagers @entity {
  id: Bytes!

  campaign: Campaign

  campaignId: BigInt!
  manager: Bytes!
  rpReward: BigInt!
  usdcReward: BigInt!
  isActive: Boolean!
  usernameHash: Bytes!
  claimLimit: BigInt!
  requiresZk: Boolean!

  # Metrics
  claimsCount: BigInt!
  totalVolume: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CAMPAIGN REWARD REDEEMED
# A record of a reward redeemed for a campaign
type CampaignRewardRedeemed @entity {
  id: Bytes!

  user: User!

  campaignId: BigInt!
  manager: Bytes!
  usernameHash: Bytes
  rpReward: BigInt!
  usdcReward: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# USER RECOMMENDATION
# User recommendations to other users
type UserRecommendation @entity {
  id: Bytes!
  recommender: Bytes!
  recipient: Bytes!
  timestamp: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE DAILY METRICS
# Rolling 30d window buckets for circle score calculation
type CircleDailyMetrics @entity {
  id: Bytes! # circleId-dayNumber
  circle: Circle!
  dayNumber: BigInt! # timestamp / 86400
  # Daily counters (incremented during the day)
  settlementSecondsSum: BigInt! # Sum of settlement times for the day (SELL/PAY only)
  completedOrdersCount: BigInt! # Completed non-disputed orders (SELL/PAY, for settlement avg)
  acceptedOrdersCount: BigInt! # All orders accepted (BUY+SELL+PAY, for dispute rate denominator)
  merchantFaultDisputesCount: BigInt!
  volume: BigInt! # USDC volume
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# FCM TOKEN
# A FCM token for a merchant
type FCMToken @entity {
  id: Bytes!
  address: Bytes!
  tokens: [String!]

  merchant: CircleMerchant @relation(name: "MerchantFCM")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT WITHDRAW FEE PERCENTAGE
# A withdraw fee percentage for a merchant
type MerchantWithdrawFeePercentage @entity {
  id: Bytes!
  currency: Bytes!
  feePercentage: BigInt!
  time: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE PERMISSION
# Tracks granted permissions per circle+account with an array of selectors
type CirclePermission @entity {
  id: Bytes! # circleId-account
  circleId: BigInt!
  account: Bytes!
  selectors: [Bytes!]!
  name: String!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# INSURANCE CLAIM
# A claim submitted by a merchant against the insurance pool
type InsuranceClaim @entity(immutable: false) {
  id: Bytes! # claimId as bytes

  claimId: BigInt!
  circleId: BigInt!
  circle: Circle!
  claimant: Bytes!

  # ClaimType: 0=ABSCONDING, 1=MERCHANT_FAULT, 2=NON_MERCHANT_FAULT
  claimType: Int!

  # ClaimStatus: 0=DEFAULT, 1=SUBMITTED, 2=APPROVED, 3=REJECTED, 4=SETTLED, 5=WITHDRAWN
  status: Int!

  fiatAmount: BigInt!
  usdcAmount: BigInt!
  accountNo: BigInt!

  orderId: BigInt!
  order: Orders!

  # Claimant merchant
  merchant: CircleMerchant

  currency: Bytes!
  submittedAt: BigInt!
  reviewedAt: BigInt!

  # Address that approved or rejected the claim
  resolver: Bytes!

  requiresSuperAdminApproval: Boolean!
  superAdminApproved: Boolean!
  payoutEligibleAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
