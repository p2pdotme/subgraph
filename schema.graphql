# PROPOSAL
# A governance proposal created via GovernorFacet
# status: Pending | Active | Succeeded | Defeated | Queued | Executed | Canceled | Expired
type Proposal @entity(immutable: false) {
  id: Bytes! # proposalId as bytes
  proposalId: BigInt!
  proposer: Bytes!
  targets: [Bytes!]!
  values: [BigInt!]!
  calldatas: [Bytes!]!
  description: String!

  # Voting window (computed at creation: votingStartsAt = createdAt + votingDelay)
  votingStartsAt: BigInt!
  votingEndsAt: BigInt!

  # Vote tallies (updated on each VoteCast / VoteCastWithReason)
  forVotes: BigInt!
  againstVotes: BigInt!
  abstainVotes: BigInt!

  status: String!
  timelockEta: BigInt # timestamp after which execution is allowed (set when queued)
  # Lifecycle timestamps
  proposalCreatedAt: BigInt! # block.timestamp of ProposalCreated
  queuedAt: BigInt # block.timestamp of ProposalQueued
  executedAt: BigInt # block.timestamp of ProposalExecuted
  canceledAt: BigInt # block.timestamp of ProposalCanceled
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# VOTE
# A vote cast on a governance proposal
# support: 0 = Against, 1 = For, 2 = Abstain
type Vote @entity(immutable: true) {
  id: Bytes! # txHash + logIndex
  proposalId: BigInt!
  voter: Bytes!
  support: Int!
  votes: BigInt!
  reason: String # null unless VoteCastWithReason
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─── B2B GATEWAY ──────────────────────────────────────────────────

# INTEGRATOR
# A whitelisted B2B integrator contract
type Integrator @entity(immutable: false) {
  id: Bytes! # integrator address
  address: Bytes!
  isActive: Boolean!
  usdcThroughIntegrator: Boolean!
  # UserProxy implementation pinned at registerIntegrator time. Used by the
  # gateway to authorize CREATE2-derived proxy callers in _resolveIntegrator.
  proxyImpl: Bytes!
  # Aggregated lifetime USDC volume placed via this integrator (BUY + SELL).
  # Derived from B2BOrderPlaced / B2BSellOrderPlaced events — the contract no
  # longer stores this on-chain.
  totalVolume: BigInt!
  # Currently open BUY orders (incremented on B2BOrderPlaced, decremented on
  # B2BOrderCompleted / B2BOrderCancelled). SELL orders are not tracked here
  # — the gateway does not bookkeep them.
  activeOrderCount: BigInt!
  # Lifetime cancelled BUY orders (analytics-only).
  cancelledOrderCount: BigInt!
  # Lifetime count of integrator-side onOrderComplete reverts. Protocol-side
  # completion (USDC routing, status=COMPLETED) finalized regardless — this is
  # a tally of downstream notification failures that need ops reconciliation.
  callbackFailureCount: BigInt!
  orders: [B2BOrder!] @derivedFrom(field: "integrator")
  callbackFailures: [B2BIntegratorCallbackFailure!]
    @derivedFrom(field: "integrator")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# B2B ORDER
# Links a protocol order to its integrator. Joinable by id with the canonical
# `Orders` entity for full lifecycle (status, timestamps, merchant, etc.).
type B2BOrder @entity(immutable: false) {
  id: Bytes! # orderId as bytes (matches Orders.id)
  orderId: BigInt!
  integrator: Integrator!
  user: Bytes!
  amount: BigInt!
  # Mirrors OrderProcessorStorage.OrderType: 0=BUY, 1=SELL. PAY is never B2B.
  orderType: Int!
  # True if integrator's onOrderComplete callback reverted at completion.
  # Protocol-side state still finalised; off-chain ops must reconcile.
  callbackFailed: Boolean!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# B2B INTEGRATOR CALLBACK FAILURE
# Audit log for B2BIntegratorCallbackFailed events. Emitted when an integrator's
# onOrderComplete hook reverts during onB2BOrderComplete. The protocol-side
# completion has already finalised; this entity exists so ops/integrator can
# reconcile downstream state off-chain.
type B2BIntegratorCallbackFailure @entity(immutable: true) {
  id: Bytes! # txHash + logIndex
  orderId: BigInt!
  order: B2BOrder!
  integrator: Integrator!
  # Raw revert data returned by the integrator (4-byte selector + abi-encoded args
  # for custom errors, or string-encoded reason for `revert("...")`).
  reason: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# COMMUNITY ADMIN
# Tracks addresses granted community admin status
type CommunityAdmin @entity(immutable: false) {
  id: Bytes! # account address
  updater: Bytes!
  account: Bytes!
  isActive: Boolean!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE PERMISSION
# Tracks granted permissions per circle+account with an array of selectors
type CirclePermission @entity(immutable: false) {
  id: Bytes! # circleId-account
  circleId: BigInt!
  account: Bytes!
  selectors: [Bytes!]!
  name: String!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# PIP REFILL REQUEST
# A request by a circle admin to refill the Protocol Insurance Pool for their circle
type PIPRefillRequest @entity(immutable: false) {
  id: Bytes! # circleId as bytes (one active request per circle at a time)
  circleId: BigInt!
  circle: Circle!

  # Admin who submitted the request
  requestedBy: Bytes!
  requestedAmount: BigInt!

  # RefillStatus: 0=PENDING, 1=APPROVED, 2=CANCELLED, 3=REJECTED
  status: Int!

  requestedAt: BigInt!
  resolvedAt: BigInt!

  # Actual amount approved (set on PIPRefillApproved, may differ from requestedAmount)
  approvedAmount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# INSURANCE CLAIM
# A claim submitted by a merchant against the insurance pool
type InsuranceClaim @entity(immutable: false) {
  id: Bytes! # claimId as bytes
  claimId: BigInt!
  circleId: BigInt!
  circle: Circle!
  claimant: Bytes!
  beneficiary: Bytes!

  # ClaimType: 0=MERCHANT_ABSCONDING, 1=MERCHANT_FAULT_FUND_LOSS, 2=USER_LOSS, 3=MERCHANT_REIMBURSEMENT
  claimType: Int!

  # ClaimStatus: 0=DEFAULT, 1=SUBMITTED, 2=APPROVED, 3=REJECTED, 4=SETTLED, 5=WITHDRAWN
  status: Int!

  fiatAmount: BigInt!
  usdcAmount: BigInt!
  accountNo: BigInt!

  orderId: BigInt!
  order: Orders!

  # Claimant merchant
  merchant: CircleMerchant

  currency: Bytes!
  submittedAt: BigInt!
  reviewedAt: BigInt!
  settledAt: BigInt!

  amendCount: Int!
  requiresSuperAdminApproval: Boolean!
  superAdminApproved: Boolean!
  isCustomClaim: Boolean!
  beneficiaryIsMerchant: Boolean!

  # Address that approved or rejected the claim
  resolver: Bytes!
  circleAdminAtSubmit: Bytes!
  metadataURI: String!

  payoutEligibleAt: BigInt!

  # R6 Ops contest window: while contested the claim cannot settle; removing
  # the contest restarts a fresh 48h window (payoutEligibleAt is refreshed)
  contested: Boolean!
  contestedBy: Bytes
  contestedAt: BigInt
  contestCount: Int!

  # Settlement breakdown
  settledUsdcAmount: BigInt!
  fromCAIP: BigInt!
  fromCALR: BigInt!
  fromPIP: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# INSURANCE DEBT ACTIVITY
# Immutable timeline of insurance-debt ledger events on a merchant's payment
# channel. Accrual happens when a write-off exceeds the PC's fiat balance;
# repayment is either organic (buy-order completion credit) or direct
# (repayInsuranceDebt USDC payment).
# activityType: ACCRUED | REPAID | REPAID_DIRECT
type InsuranceDebtActivity @entity(immutable: true) {
  id: Bytes! # txHash + logIndex
  paymentChannel: MerchantPaymentChannels!
  merchant: Bytes!
  accountNo: BigInt!
  activityType: String!

  # Set on ACCRUED only; the claim whose write-off created the debt.
  claimId: BigInt

  # Fiat amount moved on the debt ledger by this event:
  #  - ACCRUED: residual fiat added to debt
  #  - REPAID / REPAID_DIRECT: fiat amount applied against debt
  amountFiat: BigInt!

  # REPAID only: portion of the credit that exceeded the debt and flowed to fiatBalance.
  surplusToFreeFiat: BigInt!

  # REPAID_DIRECT only: USDC the merchant paid in (6dp).
  usdcPaid: BigInt!

  # Outstanding debt on the PC after applying this event.
  debtAfter: BigInt!

  timestamp: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE ADMIN CALR
# Cumulative CALR (Circle Admin Locked Reward) ledger per admin on the
# Insurance Diamond. The on-chain lockedBalance cannot be mirrored exactly —
# expired locks vest into unlockableBalance lazily, with no event — so exact
# cumulative counters are kept instead. Outstanding CALR still held by the
# Insurance Diamond (locked or vested-but-unclaimed) is derivable as:
#   totalLocked - totalUnlocked - totalReverted - totalSettled
type CircleAdminCALR @entity(immutable: false) {
  id: Bytes! # admin address
  admin: Bytes!

  totalLocked: BigInt! # sum of CALRLocked amounts
  totalUnlocked: BigInt! # sum of CALRUnlocked amounts (direct unlock + pullUnlockableCALR)
  totalReverted: BigInt! # sum of CALRLockReverted actual amounts
  totalSettled: BigInt! # sum of ClaimSettled.fromCALR drained from this admin's bucket
  lastLockExpiresAt: BigInt! # lockExpiresAt of the most recent CALRLocked
  activities: [CALRActivity!]! @derivedFrom(field: "calr")

  # Updated on every event for this admin; reflect the most recent event, not creation.
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CALR ACTIVITY
# Immutable timeline of every CALR movement for a circle admin, across both
# diamonds: lock/unlock/revert on the Insurance Diamond, settlement drains
# attributed from ClaimSettled, and the main-side claimable credit that
# mirrors each unlock.
# activityType: LOCKED | UNLOCKED | LOCK_REVERTED | SETTLEMENT_DRAIN | CLAIMABLE_CREDITED
type CALRActivity @entity(immutable: true) {
  id: Bytes! # txHash + logIndex
  calr: CircleAdminCALR!
  admin: Bytes!
  activityType: String!

  # USDC moved by this event (6dp).
  amount: BigInt!

  # LOCKED only: end of the new lock window.
  lockExpiresAt: BigInt
  # LOCK_REVERTED only: the order whose lock was reverted and the per-order
  # snapshot the revert tried to return (amount holds the actual returned).
  orderId: BigInt
  snapshotAmount: BigInt
  # SETTLEMENT_DRAIN only: the claim whose settlement drained the bucket.
  claimId: BigInt

  timestamp: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# USER P2P STAKE
# Aggregated per-user P2P stake state, updated by every P2PStakeBoostFacet event.
# Status reflects the on-chain state machine: NONE | ACTIVE | COOLDOWN | SEIZED.
type UserP2PStake @entity(immutable: false) {
  id: Bytes! # user address as bytes
  user: Bytes!

  # Current on-chain state
  stakedAmount: BigInt! # current locked tokens (0 in NONE/SEIZED)
  status: String! # NONE | ACTIVE | COOLDOWN | SEIZED
  cooldownEnd: BigInt! # 0 when not in COOLDOWN
  totalSeized: BigInt! # sum of all P2PStakeSeized amounts
  firstStakedAt: BigInt! # block.timestamp of first P2PStaked (0 until first stake)
  lastActionAt: BigInt! # block.timestamp of most recent event
  # Last seizure metadata (only populated once a seize occurs)
  fraudReserve: Bytes # address that received the seized stake
  activities: [UserP2PStakeActivity!]! @derivedFrom(field: "stake")

  # Updated on every event for this user; reflect the most recent event, not creation.
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# USER P2P STAKE ACTIVITY
# Immutable timeline of every P2PStakeBoostFacet event for a user.
# activityType: STAKED | TOPPED_UP | UNSTAKE_REQUESTED | UNSTAKE_CANCELLED | UNSTAKE_CLAIMED | COOLDOWN_EXTENDED | SEIZED
type UserP2PStakeActivity @entity(immutable: true) {
  id: Bytes! # txHash + logIndex
  stake: UserP2PStake!
  user: Bytes!
  userAddress: String!
  activityType: String!

  # Event payload (zero when not applicable to the activity type)
  amount: BigInt! # event `amount` field
  newTotal: BigInt! # event `newTotal` field (STAKED / TOPPED_UP)
  cooldownEnd: BigInt! # event `cooldownEnd` / `newCooldownEnd` (UNSTAKE_REQUESTED / COOLDOWN_EXTENDED)
  fraudReserve: Bytes # SEIZED only
  # Post-action snapshot of user's staked balance and status (for easy timeline queries)
  stakedAmountAfter: BigInt!
  statusAfter: String!

  timestamp: BigInt! # block.timestamp at emission
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# INSURANCE APPROVER
# Tracks which addresses are approved to handle claims for a given currency
type InsuranceApprover @entity(immutable: false) {
  id: Bytes! # currency + approver
  currency: Bytes!
  approver: Bytes!
  allowed: Boolean!
  admin: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# INSURANCE CURRENCY CONFIG
# Current insurance parameters for a currency, mirroring
# InsurancePoolStorage.configByCurrency. Updated by InsuranceConfigUpdated,
# which is emitted both by the pool setter and by the DiamondInitV27 upgrade
# (the latter flips payoutDelay to 0). Keyed by currency tag.
type InsuranceCurrencyConfig @entity(immutable: false) {
  id: Bytes! # currency (bytes32)
  currency: Bytes!
  caipFeeBps: Int!
  calrLockBps: Int!
  calrLockPeriod: BigInt!
  payoutDelay: BigInt!
  maxClaimAge: BigInt!
  orderClaimWindow: BigInt!
  largeClaimThreshold: BigInt!

  # Admin that triggered the most recent update.
  updatedBy: Bytes!
  updatedAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# ROLES & PERMISSIONS (contracts-v4 rollout R2 → R8)
# Selector-level role registry (RoleAdminFacet on the main Diamond), country
# scope (CountryFacet), break-glass pause (OrderProcessorFacet), dual-sign,
# per-lead timelocks (LeadTimelock) and the legacy admin stores retired at R8.
# ─────────────────────────────────────────────────────────────────────────────

# PROTOCOL AUTH STATE
# Singleton (id = "auth"). Tracks the shadow-mode legacy switch, the
# LegacyAuthUsed counters that gate the R7 flip, and the emergency pause.
type ProtocolAuthState @entity(immutable: false) {
  id: Bytes!
  # Inverted on-chain (`legacyAuthDisabled`): true until R7 flips it off
  legacyAuthEnabled: Boolean!
  legacyAuthToggledBy: Bytes
  legacyAuthToggledAt: BigInt
  # LegacyAuthUsed emissions across all three emission points
  legacyAuthUsedCount: BigInt!
  lastLegacyAuthUsedAt: BigInt
  # Selectors currently present in the policy registry
  configuredSelectorCount: Int!
  # R7 break-glass pause (OrderProcessorFacet.emergencyPause)
  emergencyPaused: Boolean!
  emergencyPausedBy: Bytes
  emergencyPausedAt: BigInt

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# PROTOCOL ROLE
# One row per role bit (0 = DEV_LEAD … 9 = ADMIN_VALUE)
type ProtocolRole @entity(immutable: false) {
  id: Bytes! # single byte: role id
  role: Int!
  name: String!
  memberCount: Int!
  # Bound LeadTimelock (R7); null while unbound
  timelock: LeadTimelock
  members: [RoleMember!]! @derivedFrom(field: "protocolRole")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ROLE MEMBER
# Membership of an account in a role; revocations flip isActive
type RoleMember @entity(immutable: false) {
  id: Bytes! # role byte ++ account
  protocolRole: ProtocolRole!
  role: Int!
  roleName: String!
  account: Bytes!
  isActive: Boolean!
  # Operator of the latest grant / revoke
  operator: Bytes!
  grantedAt: BigInt!
  revokedAt: BigInt

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ADMIN COUNTRY
# Country assignment of an ADMIN / ADMIN_VALUE holder (R5 country scope)
type AdminCountry @entity(immutable: false) {
  id: Bytes! # admin ++ country
  admin: Bytes!
  country: Country!
  countryCode: String!
  assigned: Boolean!
  operator: Bytes!
  assignedAt: BigInt!
  unassignedAt: BigInt

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# COUNTRY
# ISO-3166 alpha-2 country entity (R5). Currencies bind to exactly one country.
type Country @entity(immutable: false) {
  id: Bytes! # bytes32 country
  country: Bytes!
  code: String!
  isActive: Boolean!
  currencies: [Currency!]! @derivedFrom(field: "country")
  admins: [AdminCountry!]! @derivedFrom(field: "country")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# SELECTOR POLICY
# Per-selector authorization policy — the on-chain permission map
type SelectorPolicy @entity(immutable: false) {
  id: Bytes! # bytes4 selector
  selector: Bytes!
  # "Contract.fn(types)" from src/constants/selectors.ts, "" if unknown
  functionName: String!
  roleMask: BigInt!
  roles: [Int!]!
  roleNames: [String!]!
  permissionless: Boolean!
  # 0 GLOBAL, 1 COUNTRY, 2 CIRCLE, 3 CURRENCY
  scope: Int!
  scopeName: String!
  # 0 ROUTINE, 1 SENSITIVE, 2 CATASTROPHIC
  tier: Int!
  tierName: String!
  timelocked: Boolean!
  dualSign: Boolean!
  coSignRoleMask: BigInt!
  coSignRoles: [Int!]!
  coSignRoleNames: [String!]!
  # false once cleared (LibAuth fails closed on unconfigured selectors)
  configured: Boolean!
  # Per-selector early cutover: legacy path ignored for this selector
  legacyExempt: Boolean!
  # LegacyAuthUsed emissions for this selector on the main Diamond
  legacyAuthUsedCount: BigInt!
  lastLegacyAuthUsedAt: BigInt
  updateCount: Int!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ROLE ACTIVITY
# Immutable audit log of every registry mutation
type RoleActivity @entity(immutable: true) {
  id: Bytes! # txHash ++ logIndex
  # ROLE_GRANTED | ROLE_REVOKED | COUNTRY_ASSIGNED | COUNTRY_UNASSIGNED |
  # TIMELOCK_SET | POLICY_SET | POLICY_CLEARED | LEGACY_AUTH_TOGGLED |
  # LEGACY_EXEMPT_SET
  action: String!
  operator: Bytes!
  role: Int
  roleName: String
  account: Bytes
  country: Bytes
  countryCode: String
  selector: Bytes
  functionName: String
  timelock: Bytes
  previousTimelock: Bytes
  flag: Boolean

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CO-SIGN
# Dual-sign record (R7): proposed by a coSignRoleMask holder, consumed by the
# gated call from a different roleMask holder, or cancelled / expired
type CoSign @entity(immutable: false) {
  id: Bytes! # key = keccak256(selector ‖ paramsHash)
  key: Bytes!
  selector: Bytes!
  functionName: String!
  proposer: Bytes!
  proposerRole: Int!
  proposerRoleName: String!
  expiry: BigInt!
  # PROPOSED | CANCELLED | CONSUMED
  status: String!
  cancelledBy: Bytes
  executor: Bytes
  proposedAt: BigInt!
  resolvedAt: BigInt

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# LEGACY AUTH USAGE
# One row per LegacyAuthUsed emission — a call that passed ONLY on the legacy
# superAdmin/admin path (i.e. a missing role grant). Zero for 7 days across all
# three emitters is the R7 flip criterion.
type LegacyAuthUsage @entity(immutable: true) {
  id: Bytes! # txHash ++ logIndex
  # MAIN_DIAMOND | INSURANCE_DIAMOND | REPUTATION_MANAGER
  source: String!
  emitter: Bytes!
  caller: Bytes!
  selector: Bytes!
  functionName: String!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# LEGACY AUTH SELECTOR STATS
# Aggregate per (emitter, selector)
type LegacyAuthSelectorStats @entity(immutable: false) {
  id: Bytes! # emitter ++ selector
  source: String!
  emitter: Bytes!
  selector: Bytes!
  functionName: String!
  count: BigInt!
  firstUsedAt: BigInt!
  lastUsedAt: BigInt!
  lastCaller: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# LEGACY ADMIN
# The pre-registry superAdmin / admin / globalAdmin stores. Replayed from
# genesis so the R8 RetirementInit address lists can be produced from here;
# the R8 cut emits the same events with status=false and drains them.
type LegacyAdmin @entity(immutable: false) {
  id: Bytes! # account
  account: Bytes!
  isSuperAdmin: Boolean!
  isAdmin: Boolean!
  isGlobalAdmin: Boolean!
  updater: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# EMERGENCY PAUSE ACTIVITY
# Immutable log of the R7 break-glass pause toggles
type EmergencyPauseActivity @entity(immutable: true) {
  id: Bytes! # txHash ++ logIndex
  by: Bytes!
  paused: Boolean!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# INSURANCE CLAIM CONTEST ACTIVITY
# Immutable log of R6 claim contests and their removal
type InsuranceClaimContestActivity @entity(immutable: true) {
  id: Bytes! # txHash ++ logIndex
  claimId: BigInt!
  claim: InsuranceClaim!
  # CONTESTED | CONTEST_REMOVED
  action: String!
  by: Bytes!
  # Set on CONTEST_REMOVED: the fresh 48h window's release timestamp
  newEligibleAt: BigInt

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# LEAD TIMELOCK
# A per-lead OpenZeppelin TimelockController bound via RoleAdminFacet
# .setRoleTimelock (R7). Instantiated as a data-source template on binding.
type LeadTimelock @entity(immutable: false) {
  id: Bytes! # timelock address
  address: Bytes!
  # Role this timelock was last bound to (see isBound for whether it still is)
  role: Int!
  roleName: String!
  isBound: Boolean!
  boundAt: BigInt!
  unboundAt: BigInt
  # From MinDelayChange; null if the constructor emission predates indexing
  minDelay: BigInt
  operationCount: Int!
  pendingCount: Int!
  operations: [TimelockOperation!]! @derivedFrom(field: "timelock")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# TIMELOCK OPERATION
# A scheduled (batch) operation: propose → delay → execute, cancellable
type TimelockOperation @entity(immutable: false) {
  id: Bytes! # timelock ++ operationId
  timelock: LeadTimelock!
  operationId: Bytes!
  predecessor: Bytes!
  salt: Bytes
  delay: BigInt!
  # PENDING | EXECUTED | CANCELLED
  status: String!
  scheduledAt: BigInt!
  readyAt: BigInt!
  executedAt: BigInt
  cancelledAt: BigInt
  callCount: Int!
  executedCallCount: Int!
  calls: [TimelockCall!]! @derivedFrom(field: "operation")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# TIMELOCK CALL
# One call inside a timelock operation
type TimelockCall @entity(immutable: false) {
  id: Bytes! # timelock ++ operationId ++ index
  operation: TimelockOperation!
  index: Int!
  target: Bytes!
  value: BigInt!
  data: Bytes!
  selector: Bytes!
  functionName: String!
  executed: Boolean!
  executedAt: BigInt

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
