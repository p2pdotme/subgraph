type Circle @entity {
  id: Bytes!

  circleId: BigInt!
  admin: String!
  currency: Bytes!
  name: String!
  communityLink: String!
  isAutoApprovedPCEnabled: Boolean! 

  metrics: CircleMetrics @relation(name: "circle")

  blockNumber: BigInt! 
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Staker @entity {
  id: Bytes!

  staker: String!

  totalStaked: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type CircleStakeRecords @entity {
  id: Bytes!

  circle: Circle!
  staker: Staker!
  
  amount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type CircleUnstakeRecords @entity {
  id: Bytes!

  circle: Circle!
  staker: Staker!
  
  status: BigInt!
  amount: BigInt!
  availableAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type CircleMetrics @entity {
  id: Bytes!

  circle: Circle @relation(name: "metrics")

  totalStaked: BigInt!
  adminStaked: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}