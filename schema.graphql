# CIRCLE
type Circle @entity(immutable: false) {
  id: Bytes!

  circleId: BigInt!
  admin: String!
  currency: Bytes!
  name: String!
  communityLink: String!
  adminLink: String!
  isAutoApprovedPCEnabled: Boolean!

  metrics: CircleMetrics @relation(name: "circle")
  orderMetricsByMonth: [CircleOrderMetricsByMonth!]
    @derivedFrom(field: "circle")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# STAKER
# An individual who stakes in any circle
type Staker @entity(immutable: false) {
  id: Bytes!

  staker: String!

  totalStaked: BigInt!

  circleUsdcStakeRecords: [CircleUsdcStakeRecords!]!
  circleUsdcUnstakeRecords: [CircleUsdcUnstakeRecords!]!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE STAKE RECORDS
# A record of a staker's stake in a circle
type CircleUsdcStakeRecords @entity(immutable: false) {
  id: Bytes!

  circle: Circle!
  staker: Staker!

  amount: BigInt!

  unstakeRequest: CircleUsdcUnstakeRecords

  stakedAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE UNSTAKE RECORDS
# A record of a staker's unstake in a circle
type CircleUsdcUnstakeRecords @entity(immutable: false) {
  id: Bytes!

  circle: Circle!
  staker: Staker!

  amount: BigInt!
  availableAt: BigInt!

  status: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE METRICS
# Metrics for a circle
type CircleMetrics @entity(immutable: false) {
  id: Bytes!

  circle: Circle @relation(name: "metrics")

  # STAKING METRICS
  totalUsdcStaked: BigInt!
  adminUsdcStaked: BigInt!

  # DELEGATION METRICS
  totalDelegatedStake: BigInt!

  # VOLUME METRICS
  totalVolume: BigInt!

  # ORDER METRICS
  totalPlacedOrdersCount: BigInt!

  # DISPUTE METRICS
  raisedDisputesCount: BigInt!
  resolvedDisputesCount: BigInt!

  # MERCHANT METRICS
  totalMerchantsCount: BigInt!

  # CIRCLE SCORE
  circleScore: BigInt! # Score 0–100
  circleStatus: String! # bootstrap | active | rejected | paused
  hasMinOrdersForScore: Boolean!
  lastScoreUpdateTimestamp: BigInt!
  scoreState: CircleScoreState!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE SCORE STATE
# Internal state used to calculate circle score. Separated from CircleMetrics
type CircleScoreState @entity(immutable: false) {
  id: Bytes! # same as circle id
  # 30d rolling metrics (recomputed from CircleDailyMetrics)
  avgSettlementSeconds: BigInt! # paidAt → completedAt (SELL/PAY only)
  disputeRate: BigInt! # 30d rate × 10000
  rolling30dVolume: BigInt! # 30d USDC volume
  rolling30dCompletedOrders: BigInt! # 30d SELL/PAY completed (sample size for speed subscore)
  rolling30dAcceptedOrders: BigInt! # 30d accepted (sample size for dispute subscore)
  # Lifetime counters
  lifetimeAcceptedOrders: BigInt! # All orders ever accepted by a merchant
  cumulativeSettlementSeconds: BigInt! # Running sum for settlement avg
  completedSellPayOrders: BigInt! # SELL/PAY completed minus dispute-reversed (settlement avg denominator)
  activeMerchantsCount: BigInt! # Merchants with stake > 0, online, not blacklisted (score signal)
  availableMerchantsCount: BigInt! # active + not unstake-requested (routing capacity signal)
  merchantFaultDisputesCount: BigInt! # All-time merchant fault disputes
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# CIRCLE MERCHANT
# A merchant who is registered in a circle
type CircleMerchant @entity(immutable: false) {
  id: Bytes!
  merchant: String!
  telegramId: String!
  circleId: BigInt!

  # Nullable: a merchant stub may be created by order/delegation events before
  # (or instead of) its MerchantRegisteredToCircle event — e.g. when the RPC
  # provider drops logs. Null here means "registration not yet indexed"; it is
  # backfilled by the first circleId-carrying event and never left dangling.
  circle: Circle
  orders: [Orders!]

  stakedAmount: BigInt!
  delegatedStakedAmount: BigInt!

  isOnline: Boolean!
  isBlacklisted: Boolean!
  isOngoingOrder: Boolean!

  # Unstake request tracking for availability
  isUnstakeRequested: Boolean!
  unstakeRequestedAt: BigInt!
  unstakeAmount: BigInt!

  onlineAt: BigInt!
  offlineAt: BigInt!
  startedAt: BigInt!

  currency: Bytes!

  paymentChannels: [MerchantPaymentChannels!] @derivedFrom(field: "merchant")
  volumeByMonth: [MerchantVolumeByMonth!] @derivedFrom(field: "merchant")
  orderMetricsByMonth: [MerchantOrderMetricsByMonth!]
    @derivedFrom(field: "merchant")
  paymentChannelMigrations: [PaymentChannelMigration!]
    @derivedFrom(field: "merchant")
  stakeHistory: [MerchantStakeHistory!] @derivedFrom(field: "merchant")
  fcmTokens: [FCMToken!] @derivedFrom(field: "merchant")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# MERCHANT PAYMENT CHANNELS
# A payment channel of a merchant
type MerchantPaymentChannels @entity(immutable: false) {
  id: Bytes!
  merchant: CircleMerchant!

  pcConfigId: BigInt!
  accountNo: BigInt!
  label: String!
  isActive: Boolean!
  status: Int!
  isMonthlyVolumeUnlimited: Boolean!
  fiatBalance: BigInt!

  # Outstanding insurance debt owed to the protocol on this payment channel,
  # in fiat units (same denomination as fiatBalance). Accrues when an insurance
  # write-off exceeds fiatBalance; repaid organically by buy-order completions
  # or directly via repayInsuranceDebt.
  insuranceDebt: BigInt!

  # Signed net fiat position = fiatBalance - insuranceDebt. Materialized so it
  # can be filtered/ordered in queries; negative when the channel is in debt.
  # Maintained via savePaymentChannel(); at most one of fiatBalance /
  # insuranceDebt is non-zero at a time per the on-chain invariant.
  realFiatBalance: BigInt!

  # Current volume tracking for availability calculations
  dailyVolume: BigInt!
  monthlyVolume: BigInt!
  lastUpdatedDailyVolumeAt: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ORDERS
# A order in a circle
type Orders @entity(immutable: false) {
  id: Bytes!
  orderId: BigInt!
  type: Int!
  status: Int!
  circleId: BigInt!
  circle: Circle
  isLegacyOrder: Boolean!

  userAddress: Bytes!
  usdcRecipientAddress: Bytes!

  usdcAmount: BigInt!
  fiatAmount: BigInt!

  currency: Bytes!

  isUserCompleted: Boolean!
  userCompletedAt: BigInt!
  completedAt: BigInt!
  placedAt: BigInt!
  acceptedAt: BigInt!
  paidAt: BigInt!
  cancelledAt: BigInt!

  acceptedPCId: BigInt!
  acceptedMerchantAddress: Bytes!
  merchant: CircleMerchant
  assignedMerchants: [AssignedMerchants!]

  pubkey: String!
  encUpi: String!
  userPubKey: String!
  encMerchantUpi: String!
  cancelledBy: Bytes!

  # ADDITIONAL ORDER DETAILS
  fixedFeePaid: BigInt!
  tipsPaid: BigInt!
  actualUsdcAmount: BigInt!
  actualFiatAmount: BigInt!

  # REWARD DETAILS
  merchantRewardAmount: BigInt!
  circleAdminRewardAmount: BigInt!
  circleUSDCStakeDelegationRewardAmount: BigInt!

  # DISPUTE DETAILS
  disputeStatus: Int!
  disputeRedactTransId: BigInt!
  disputeAccountNumber: BigInt!
  disputeSettledByAddr: Bytes!
  disputeFaultType: Int!
  disputePlacedAt: BigInt!
  disputeSettledAt: BigInt!

  # APPEAL DETAILS
  appealedAt: BigInt!
  appealedByMerchantAddress: Bytes!

  # INSURANCE CLAIMS
  claimSubmissions: [InsuranceClaim!] @derivedFrom(field: "order")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

