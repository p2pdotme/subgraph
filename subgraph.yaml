  - kind: ethereum
    name: RewardsFacet
    network: base
    source:
      address: "0x4cad6eC90e65baBec9335cAd728DDC610c316368"
      abi: RewardsFacet
      startBlock: 29875200
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - RewardsFacet
      abis:
        - name: RewardsFacet
          file: ./abis/RewardsFacet.json
      eventHandlers:
        # Circle admin rewards (by admin address)
        - event: CircleAdminRewardAllocated(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleCircleAdminRewardAllocated
        - event: CircleAdminRewardClaimed(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleCircleAdminRewardClaimed
        - event: CircleAdminRewardAdjusted(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleCircleAdminRewardAdjusted
        # Merchant rewards (by merchant address)
        - event: MerchantRewardAllocated(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleMerchantRewardAllocated
        - event: MerchantRewardClaimed(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleMerchantRewardClaimed
        - event: MerchantRewardAdjusted(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleMerchantRewardAdjusted
      file: ./src/rewards.ts
  - kind: ethereum
