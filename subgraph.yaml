specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CircleFacet
    network: mainnet
    source:
      address: "0x4cad6eC90e65baBec9335cAd728DDC610c316368"
      abi: CircleFacet
      startBlock: 200000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CircleFacet
      abis:
        - name: CircleFacet
          file: ./abis/CircleFacet.json
      eventHandlers:
        - event: CircleCreated(indexed uint256,indexed address,bytes32,string,string,bool,uint256)
          handler: handleCircleCreated
        - event: CircleProtocolTokenStaked(indexed uint256,indexed address,uint256)
          handler: handleCircleProtocolTokenStaked
      file: ./src/circle-facet.ts
  - kind: ethereum
    name: USDCStakeDelegationFacet
    network: mainnet
    source:
      address: "0x4cad6eC90e65baBec9335cAd728DDC610c316368"
      abi: USDCStakeDelegationFacet
      startBlock: 200000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - USDCStakeDelegationFacet
      abis:
        - name: USDCStakeDelegationFacet
          file: ./abis/USDCStakeDelegationFacet.json
      eventHandlers:
        - event: ExitRequested(indexed address,indexed uint256,uint256,uint256)
          handler: handleExitRequested
        - event: ExitProceedsWithdrawn(indexed address,indexed uint256,uint256)
          handler: handleExitProceedsWithdrawn
      file: ./src/stake-delegation-facet.ts
  - kind: ethereum
    name: CircleMerchantFacet
    network: mainnet
    source:
      address: "0x4cad6eC90e65baBec9335cAd728DDC610c316368"
      abi: CircleMerchantFacet
      startBlock: 200000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CircleMerchantFacet
      abis:
        - name: CircleMerchantFacet
          file: ./abis/CircleMerchantFacet.json
      eventHandlers:
        - event: MerchantRegistered(indexed address,indexed uint256,string,uint256)
          handler: handleMerchantRegistered
      file: ./src/circle-merchants.ts
  - kind: ethereum
    name: OrderFlowHelper
    network: mainnet
    source:
      address: "0x4cad6eC90e65baBec9335cAd728DDC610c316368"
      abi: OrderFlowHelper
      startBlock: 200000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OrderFlowHelper
      abis:
        - name: OrderFlowHelper
          file: ./abis/OrderFlowHelper.json
      eventHandlers:
        - event: OrderCompleted(indexed uint256,indexed address,uint256,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256))
          handler: handleOrderCompleted
      file: ./src/order.ts
  - kind: ethereum
    name: OrderProcessorFacet
    network: mainnet
    source:
      address: "0x4cad6eC90e65baBec9335cAd728DDC610c316368"
      abi: OrderProcessorFacet
      startBlock: 200000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OrderProcessorFacet
      abis:
        - name: OrderProcessorFacet
          file: ./abis/OrderProcessorFacet.json
      eventHandlers:
        - event: OrderDispute(indexed address,indexed uint256,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256))
          handler: handleOrderDispute
      file: ./src/order.ts
  - kind: ethereum
    name: OrderFlowFacet
    network: mainnet
    source:
      address: "0x4cad6eC90e65baBec9335cAd728DDC610c316368"
      abi: OrderFlowFacet
      startBlock: 200000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OrderFlowFacet
      abis:
        - name: OrderFlowFacet
          file: ./abis/OrderFlowFacet.json
      eventHandlers:
        - event: CancelledOrders(indexed uint256,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256))
          handler: handleCancelledOrders
      file: ./src/order.ts