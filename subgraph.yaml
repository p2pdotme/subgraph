        - event: MerchantRewardAllocatedForOrder(indexed uint256,indexed address,uint256)
          handler: handleMerchantRewardAllocatedForOrder
        - event: CircleAdminRewardAllocatedForOrder(indexed uint256,indexed uint256,uint256)
