specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CircleFacet
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: CircleFacet
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CircleFacet
      abis:
        - name: CircleFacet
          file: ./abis/CircleFacet.json
      eventHandlers:
        - event: CircleCreated(indexed address,indexed uint256,bytes32,string,string,string,bool)
          handler: handleCircleCreated
        # - event: CircleProtocolTokenStaked(indexed uint256,indexed address,uint256)
        #   handler: handleCircleProtocolTokenStaked
      file: ./src/circle-facet.ts
  - kind: ethereum
    name: USDCStakeDelegationFacet
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: USDCStakeDelegationFacet
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - USDCStakeDelegationFacet
        - MerchantDelegationRecord
      abis:
        - name: USDCStakeDelegationFacet
          file: ./abis/USDCStakeDelegationFacet.json
      eventHandlers:
        # This event emit when community member / admin stake usdc in circle
        - event: UsdcStakedForDelegationInCircle(indexed address,indexed uint256,uint256)
          handler: handleUsdcStakedForDelegationInCircle
        # This event emit when community member / admin raise unstake request
        - event: ExitRequested(indexed address,indexed uint256,uint256,uint256)
          handler: handleExitRequested
        # This event emit when community member / admin withdraw unstake request
        - event: ExitProceedsWithdrawn(indexed address,indexed uint256,uint256)
          handler: handleExitProceedsWithdrawn
        # This event emit when admin delegate stake to merchant
        - event: UsdcDelegatedToMerchantInCircle(indexed uint256,indexed address,uint256)
          handler: handleUsdcDelegatedToMerchantInCircle
        # This event emit when admin undelegate stake from merchant
        - event: UsdcUndelegatedFromMerchantInCircle(indexed uint256,indexed address,uint256)
          handler: handleUsdcUndelegatedFromMerchantInCircle
      file: ./src/stake-delegation.ts
  - kind: ethereum
    name: OrderFlowHelper
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: OrderFlowHelper
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OrderFlowHelper
      abis:
        - name: OrderFlowHelper
          file: ./abis/OrderFlowHelper.json
      eventHandlers:
        - event: OrderCompleted(indexed uint256,indexed address,uint256,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256))
          handler: handleOrderCompleted
        - event: BuyOrderPaid(indexed uint256,indexed address,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256))
          handler: handleBuyOrderPaid
        - event: OrderAccepted(indexed uint256,indexed address,string,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256))
          handler: handleOrderAccepted
        - event: AdditionalOrderDetails(indexed uint256,(uint64,uint64,uint128,uint128,uint128,uint256,uint256))
          handler: handleAdditionalOrderDetails
      file: ./src/order.ts
  - kind: ethereum
    name: OrderProcessorFacet
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: OrderProcessorFacet
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OrderProcessorFacet
      abis:
        - name: OrderProcessorFacet
          file: ./abis/OrderProcessorFacet.json
      eventHandlers:
        - event: OrderDispute(indexed address,indexed uint256,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256),uint8)
          handler: handleOrderDisputeWithFaultType
        - event: CircleStatusUpdated(indexed address,indexed uint256,uint8)
          handler: handleCircleStatusUpdated
      file: ./src/order.ts
  - kind: ethereum
    name: OrderFlowFacet
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: OrderFlowFacet
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OrderFlowFacet
      abis:
        - name: OrderFlowFacet
          file: ./abis/OrderFlowFacet.json
      eventHandlers:
        - event: OrderPlaced(indexed uint256,indexed address,indexed address,uint256,uint8,uint256,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256))
          handler: handleOrderPlaced
        - event: CancelledOrders(indexed uint256,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256))
          handler: handleCancelledOrders
        - event: MerchantAssignedNewOrder(indexed uint256,indexed address,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256),uint256)
          handler: handleMerchantAssignedNewOrder
        - event: MerchantReAssignedNewOrder(indexed uint256,indexed address,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256),uint256)
          handler: handleMerchantReAssignedNewOrder
        - event: SellOrderUpiSet(indexed uint256,indexed address,(uint256,uint256,uint256,uint256,uint256,address,address,address,string,string,bool,uint8,uint8,(uint8,uint8,uint256,uint256),uint256,string,string,uint256,uint256[],bytes32,uint256,uint256))
          handler: handleSellOrderUpiSet
        - event: OrderCancelledBy(indexed uint256,address)
          handler: handleOrderCancelledBy
        - event: AdditionalOrderDetails(indexed uint256,(uint64,uint64,uint128,uint128,uint128,uint256,uint256))
          handler: handleAdditionalOrderDetails
      file: ./src/order.ts
  - kind: ethereum
    name: MerchantOnboardFacet
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: MerchantOnboardFacet
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MerchantOnboardFacet
        - PaymentChannelMigration
      abis:
        - name: MerchantOnboardFacet
          file: ./abis/MerchantOnboardFacet.json
      eventHandlers:
        - event: MerchantRegisteredToCircle(indexed address,uint256,uint256,string,bytes32)
          handler: handleMerchantRegisteredToCircle
        - event: PaymentChannelMigrationRequest(indexed address,indexed uint256,indexed uint256,uint256,uint256,uint8,uint256,uint256)
          handler: handlePaymentChannelMigrationRequest
        - event: UnstakeRequested(indexed address,(string,uint8,(uint256,uint256,string,uint8,bool,uint256,uint256)[]),(uint256,bool,uint256,uint256,uint256,uint256,bool,bytes32,uint256,uint256,uint256),uint256)
          handler: handleUnstakeRequested
        - event: UnstakeRequestCancelled(indexed address)
          handler: handleUnstakeRequestCancelled
        - event: UnstakeApproved(indexed address,uint256,(string,uint8,(uint256,uint256,string,uint8,bool,uint256,uint256)[]),(uint256,bool,uint256,uint256,uint256,uint256,bool,bytes32,uint256,uint256,uint256),uint256,uint256)
          handler: handleUnstakeApproved
        - event: MerchantWithoutFundsTracker(indexed address,(string,uint8,(uint256,uint256,string,uint8,bool,uint256,uint256)[]),(uint256,bool,uint256,uint256,uint256,uint256,bool,bytes32,uint256,uint256,uint256),uint256)
          handler: handleMerchantWithoutFundsTracker
        - event: MerchantStaked(indexed address,uint256,(string,uint8,(uint256,uint256,string,uint8,bool,uint256,uint256)[]),(uint256,bool,uint256,uint256,uint256,uint256,bool,bytes32,uint256,uint256,uint256),uint256)
          handler: handleMerchantStaked
        - event: MonthlyVolumeUnlimitedFlagUpdated(indexed address,indexed uint256,bool)
          handler: handleMonthlyVolumeUnlimitedFlagUpdated
      file: ./src/circle-merchants.ts
  - kind: ethereum
    name: MerchantRegistryFacet
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: MerchantRegistryFacet
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MerchantRegistryFacet
      abis:
        - name: MerchantRegistryFacet
          file: ./abis/MerchantRegistryFacet.json
      eventHandlers:
        - event: OnlineOfflineToggled(indexed address,(string,uint8,(uint256,uint256,string,uint8,bool,uint256,uint256)[]),(uint256,bool,uint256,uint256,uint256,uint256,bool,bytes32,uint256,uint256,uint256))
          handler: handleOnlineOfflineToggled
        - event: BlacklistMerchant(indexed address,bool)
          handler: handleBlacklistMerchant
        - event: MerchantOngoingOrder(indexed address,bool,bytes32)
          handler: handleMerchantOngoingOrder
        - event: Merchant(indexed address,(string,uint8,(uint256,uint256,string,uint8,bool,uint256,uint256)[]),(uint256,bool,uint256,uint256,uint256,uint256,bool,bytes32,uint256,uint256,uint256),uint256,uint256,uint256,uint256)
          handler: handleMerchant
        - event: MerchantVolume(indexed address,uint256,uint256,uint256)
          handler: handleMerchantVolume
      file: ./src/circle-merchants.ts
  - kind: ethereum
    name: RewardsFacet
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: RewardsFacet
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - RewardsFacet
      abis:
        - name: RewardsFacet
          file: ./abis/RewardsFacet.json
      eventHandlers:
        # Circle admin rewards (by admin address)
        - event: CircleAdminRewardAllocated(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleCircleAdminRewardAllocated
        - event: CircleAdminRewardClaimed(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleCircleAdminRewardClaimed
        - event: CircleAdminRewardAdjusted(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleCircleAdminRewardAdjusted
        # Merchant rewards (by merchant address)
        - event: MerchantRewardAllocated(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleMerchantRewardAllocated
        - event: MerchantRewardClaimed(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleMerchantRewardClaimed
        - event: MerchantRewardAdjusted(indexed address,uint256,(uint256,uint256,uint256,uint256,uint256))
          handler: handleMerchantRewardAdjusted
      file: ./src/rewards.ts
  - kind: ethereum
    name: CountryFacet
    network: base-sepolia
    source:
      address: "0xF44263e534237554e83Ba3d5c9F4d31Ecfcb622A"
      abi: CountryFacet
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PaymentChannelConfig
        - Currency
      abis:
        - name: CountryFacet
          file: ./abis/CountryFacet.json
      eventHandlers:
        - event: PaymentChannelConfigChanged((uint256,string,uint256,bytes32,bool))
          handler: handlePaymentChannelConfigChanged
        - event: CurrencyToggled(indexed bytes32,indexed bool)
          handler: handleCurrencyToggled
      file: ./src/country-facet.ts
  - kind: ethereum
    name: ReputationManager
    network: base-sepolia
    source:
      address: "0x5Fb19218655c96780f27dF33289153174c45adF6"
      abi: ReputationManager
      startBlock: 38032241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AadhaarVerified
        - OnchainActivityRPUpdated
        - ReputationPointsUpdated
        - UserBlacklisted
        - UserWhitelisted
        - UserRpUpdatedByAdmin
        - SocialVerified
        - MerchantReferralClaimed
        - MerchantReferralRevenueClaimed
        - CampaignCreated
        - UserVoted
      abis:
        - name: ReputationManager
          file: ./abis/ReputationManager.json
      eventHandlers:
        - event: AadhaarVerified(indexed address,bool,uint256)
          handler: handleAadhaarVerified
        - event: OnchainActivityRPUpdated(indexed address,uint256)
          handler: handleOnchainActivityRPUpdated
        - event: ReputationPointsUpdated(indexed address,int256,(uint256,uint256,bool))
          handler: handleReputationPointsUpdated
        - event: UserBlacklisted(indexed address)
          handler: handleUserBlacklisted
        - event: UserWhitelisted(indexed address)
          handler: handleUserWhitelisted
        - event: UserRpUpdatedByAdmin(indexed address,indexed address,indexed int256)
          handler: handleUserRpUpdatedByAdmin
        - event: SocialVerified(string,indexed address,bool,uint256,uint256)
          handler: handleSocialVerified
        - event: MerchantReferralClaimed(indexed address,indexed address,uint256)
          handler: handleMerchantReferralClaimed
        - event: MerchantReferralRevenueClaimed(indexed address,indexed uint256,uint256)
          handler: handleMerchantReferralRevenueClaimed
        - event: CampaignCreated(indexed uint256)
          handler: handleCampaignCreated
        - event: ManagerAddedOrUpdated(indexed uint256,indexed address,uint256,uint256,bool)
          handler: handleManagerAddedOrUpdated
        - event: ManagerAddedOrUpdated(indexed uint256,indexed address,uint256,uint256,bool,bytes32)
          handler: handleManagerAddedOrUpdatedWithHash
        - event: ManagerAddedOrUpdated(indexed uint256,indexed address,uint256,uint256,bool,bytes32,bool,uint256)
          handler: handleManagerAddedOrUpdatedWithHashAndClaimLimit
        - event: CampaignToggled(uint256,bool)
          handler: handleCampaignToggled
        - event: RewardClaimed(indexed uint256,indexed address,indexed address,uint256,uint256)
          handler: handleRewardClaimed
        - event: RewardClaimed(indexed uint256,indexed address,indexed address,uint256,uint256,bytes32)
          handler: handleRewardClaimedWithHash
        - event: UserVoted(indexed address,indexed address)
          handler: handleUserVoted
      file: ./src/reputation-manager.ts
